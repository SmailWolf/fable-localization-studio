name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    env:
      QT_VERSION: 6.8.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and zlib
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O C:/Qt --archives qtbase qttools
          if ($LASTEXITCODE) { throw 'Qt installation failed' }
          if (!$env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT='C:/vcpkg' }
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows
          if ($LASTEXITCODE) { throw 'zlib installation failed' }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "QT_ROOT=C:/Qt/$env:QT_VERSION/msvc2022_64" >> $env:GITHUB_ENV
      - name: Build Windows utility
        run: |
          cmake -S . -B build-win -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE) { throw 'Utility configuration failed' }
          cmake --build build-win --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Utility build failed' }
      - name: Build Windows CPU translation engine
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git C:/llama.cpp
          git -C C:/llama.cpp checkout bd4eeaa047006cb1fe71999fbd11134b5836e167
          cmake -S C:/llama.cpp -B C:/llama-build -A x64 -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_OPENSSL=OFF
          if ($LASTEXITCODE) { throw 'Engine configuration failed' }
          cmake --build C:/llama-build --config Release --target llama-server --parallel 2
          if ($LASTEXITCODE) { throw 'Engine build failed' }
      - name: Package Windows application
        run: |
          $root='C:/Fable-Localization-Studio-0.3.1-Windows-x86_64'
          @('bin','engine/cpu','models','fonts','licenses','bin/platforms','bin/sqldrivers') | ForEach-Object { New-Item -ItemType Directory -Force "$root/$_" | Out-Null }
          $app=Get-ChildItem bin -Recurse -Filter fable-localization-studio.exe | Select-Object -First 1
          Copy-Item $app.FullName "$root/bin/fable-localization-studio.exe"
          Copy-Item README.md,THIRD_PARTY.md,LICENSE,start.bat $root
          Get-ChildItem C:/llama-build/bin/Release | Where-Object { $_.Extension -eq '.dll' -or $_.Name -eq 'llama-server.exe' } | Copy-Item -Destination "$root/engine/cpu"
          Copy-Item C:/llama.cpp/LICENSE "$root/licenses/llama.cpp-LICENSE"
          Get-ChildItem "$env:VCPKG_ROOT/installed/x64-windows/bin/*.dll" | Copy-Item -Destination "$root/bin"
          Copy-Item "$env:VCPKG_ROOT/installed/x64-windows/share/zlib/copyright" "$root/licenses/zlib-LICENSE.txt"
          $vswhere="${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs=& $vswhere -latest -property installationPath
          $crt=Get-Item "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'Redistributable Microsoft runtime not found' }
          Get-ChildItem "$($crt.FullName)/*.dll" | Copy-Item -Destination "$root/bin" -Force
          Get-ChildItem "$($crt.FullName)/*.dll" | Copy-Item -Destination "$root/engine/cpu" -Force
          if (!(Test-Path "$root/bin/msvcp140.dll") -or !(Test-Path "$root/bin/vcruntime140.dll")) { throw 'Required CRT files missing' }
          & "$env:QT_ROOT/bin/windeployqt.exe" --release --no-translations --no-compiler-runtime --dir "$root/bin" "$root/bin/fable-localization-studio.exe"
          if ($LASTEXITCODE) { throw 'Qt deployment failed' }
          Copy-Item "$env:QT_ROOT/plugins/platforms/qoffscreen.dll" "$root/bin/platforms" -Force
          Copy-Item "$env:QT_ROOT/plugins/sqldrivers/qsqlite.dll" "$root/bin/sqldrivers" -Force
          Get-ChildItem "$env:QT_ROOT" -Recurse -File | Where-Object { $_.Name -match '^LGPL|^GPL|^LICENSE' } | ForEach-Object { Copy-Item $_.FullName "$root/licenses/Qt-$($_.Name)" -Force }
          curl.exe -fL --retry 2 https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf -o "$root/fonts/NotoSans-Regular.ttf"
          if ($LASTEXITCODE) { throw 'Noto download failed' }
          curl.exe -fL --retry 2 https://raw.githubusercontent.com/notofonts/noto-fonts/main/LICENSE -o "$root/licenses/Noto-OFL.txt"
          if ($LASTEXITCODE) { throw 'Noto license download failed' }
          @'
          Fable Localization Studio 0.3.1 — Windows x86_64

          Розпакуйте весь ZIP у доступну для запису папку та запустіть start.bat.
          Не запускайте програму всередині ZIP. Потрібні Windows 10/11 x64 та процесор з AVX2/FMA/F16C.

          Включено Qt, SQLite-плагін, Noto Sans та CPU-рушій перекладу.
          Для автоматичного перекладу вибирайте CPU. CUDA-рушій не включено.
          Модель TranslateGemma 4B GGUF потрібно завантажити окремо та вибрати у програмі.
          Ручний редактор працює без моделі.

          Виберіть Fable II або Fable III та свій оригінальний book.babel.
          Українська — типова мова, білоруська й інші мови доступні на вибір.
          Прогрес і налаштування створюються в state/ після запуску.

          Готових локалізацій, перекладів, патчів, файлів гри та чужої бази прогресу немає.
          Код утиліти — MIT. Залежності мають власні ліцензії, див. licenses/ і THIRD_PARTY.md.
          '@ | Set-Content -Encoding utf8 "$root/START_HERE_UK.txt"
          @'
          Qt 6.8.3: https://download.qt.io/archive/qt/6.8/6.8.3/submodules/ ; https://code.qt.io/cgit/qt/qtbase.git/tree/LICENSES/?h=v6.8.3
          llama.cpp: MIT; source https://github.com/ggml-org/llama.cpp/tree/bd4eeaa047006cb1fe71999fbd11134b5836e167
          zlib: https://github.com/madler/zlib ; Microsoft Visual C++ redistributable runtime: distributed with Qt deployment tools.
          Noto Sans: SIL OFL, see Noto-OFL.txt.
          '@ | Set-Content -Encoding utf8 "$root/licenses/DEPENDENCIES.txt"
          curl.exe -fL --retry 2 https://raw.githubusercontent.com/qt/qtbase/v6.8.3/LICENSES/LGPL-3.0-only.txt -o "$root/licenses/Qt-LGPL-3.0.txt"
          if ($LASTEXITCODE) { throw 'Qt license download failed' }
      - name: Test relocated Windows package
        run: |
          $root='C:/Fable-Localization-Studio-0.3.1-Windows-x86_64'
          $env:QT_QPA_PLATFORM='offscreen'
          $env:PATH="$root/bin;$env:PATH"
          $test=Start-Process "$root/bin/fable-localization-studio.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Tests failed: $($test.ExitCode)" }
          $report=Get-Content "$root/state/tests/report.json" | ConvertFrom-Json
          if ($report.passed -lt 9) { throw 'Missing test results' }
          $ui=Start-Process "$root/bin/fable-localization-studio.exe" -ArgumentList '--screenshot','C:/windows-release-preview.png' -Wait -PassThru
          if ($ui.ExitCode -ne 0 -or !(Test-Path C:/windows-release-preview.png)) { throw 'GUI smoke test failed' }
          & "$root/engine/cpu/llama-server.exe" --version
          if ($LASTEXITCODE) { throw 'Engine smoke test failed' }
          Remove-Item "$root/state" -Recurse -Force
          $forbidden=Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in '.sqlite','.babel','.bft','.gguf' }
          if ($forbidden) { throw 'Package contains local data or game assets' }
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_COMMIT: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force C:/release-assets | Out-Null
          Compress-Archive -Path C:/Fable-Localization-Studio-0.3.1-Windows-x86_64 -DestinationPath C:/release-assets/Fable-Localization-Studio-0.3.1-Windows-x86_64.zip -CompressionLevel Optimal
          $hash=(Get-FileHash C:/release-assets/*.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Fable-Localization-Studio-0.3.1-Windows-x86_64.zip" | Set-Content -Encoding ascii C:/release-assets/SHA256SUMS-Windows.txt
          Set-Location C:/release-assets
          @'
          import json,urllib.request,os
          from pathlib import Path
          repo=os.environ['GH_REPOSITORY'];token=os.environ['GH_TOKEN']
          def request(url,data=None,kind='application/json'):
              req=urllib.request.Request(url,data=data,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':kind,'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response:return json.load(response)
          notes='Windows 10/11 x64: розпакуйте весь ZIP і запустіть `start.bat`. Потрібні AVX2/FMA/F16C. Включено `.exe`, Qt, SQLite-плагін, Noto Sans та CPU llama-server. Модель TranslateGemma 4B GGUF і CUDA-рушій не включено.\n\nАдаптовано запуск Windows-рушія `.exe`, пошук DLL і кодування українського тексту. Перевірено збірку MSVC, базові тести, запуск інтерфейсу та CPU-рушія на Windows runner. Повний ігровий процес на Windows не перевірено.\n\nБез готових локалізацій, перекладів, патчів, файлів гри та бази прогресу. Код утиліти — MIT.\n\nLinux-збірка: https://github.com/SmailWolf/fable-localization-studio/releases/tag/v0.3.0'
          release=request('https://api.github.com/repos/'+repo+'/releases',json.dumps({'tag_name':'v0.3.1','target_commitish':os.environ['GH_COMMIT'],'name':'Fable Localization Studio 0.3.1 — Windows x86_64','body':notes,'draft':False,'prerelease':False}).encode())
          for p in sorted(Path('.').iterdir()):
              request('https://uploads.github.com/repos/'+repo+'/releases/'+str(release['id'])+'/assets?name='+p.name,p.read_bytes(),'application/octet-stream')
          print(release['html_url'])
          '@ | python -
          if ($LASTEXITCODE) { throw 'Release publication failed' }
